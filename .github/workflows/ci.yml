name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:

  pytest:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install bedtools and samtools
        run: |
          sudo apt-get update
          sudo apt-get install -y bedtools samtools

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

      - name: Check the CLI starts
        run: |
          cretarget --version
          cretarget --help

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Assert model checkpoints are NOT bundled
        # The launch-dCas9 weights are third-party and are fetched from Zenodo
        # at runtime. If a .pth ever creeps back into the distribution, that is
        # a licensing problem, so fail the build loudly.
        run: |
          if unzip -l dist/*.whl | grep -q '\.pth'; then
            echo "ERROR: a .pth checkpoint is bundled in the wheel"
            unzip -l dist/*.whl | grep '\.pth'
            exit 1
          fi
          if tar -tzf dist/*.tar.gz | grep -q '\.pth'; then
            echo "ERROR: a .pth checkpoint is bundled in the sdist"
            exit 1
          fi
          echo "OK: no checkpoints in the distribution"

      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/

  nextflow:
    name: nextflow smoke test (${{ matrix.nxf_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest SUPPORTED (24.04 is where process.resourceLimits landed),
        # a current production version, and latest -- the config/script
        # parser has tightened considerably across this range.
        nxf_version: ["24.04.4", "25.10.3", "26.10.5", "latest-stable"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install bedtools and samtools
        run: |
          sudo apt-get update
          sudo apt-get install -y bedtools samtools

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Nextflow
        # Installed directly rather than via a third-party action, so the only
        # external dependency is the Nextflow release asset itself.
        #
        # The asset name CHANGED mid-series, which is what broke an earlier
        # attempt here (verified against the releases API):
        #   23.04.0 / 24.04.4 -> nextflow-<ver>-all   (-dist is 404)
        #   25.10.3           -> nextflow-<ver>-dist  (-all  is 404)
        # Hence the fallback. Both are self-contained, so unlike the small
        # launcher from get.nextflow.io they need no dependency resolution at
        # first run.
        run: |
          V="${{ matrix.nxf_version }}"
          if [ "$V" = "latest-stable" ]; then
            curl -s https://get.nextflow.io | bash
          else
            BASE="https://github.com/nextflow-io/nextflow/releases/download/v$V"
            curl -fsSL -o nextflow "$BASE/nextflow-$V-dist" \
              || curl -fsSL -o nextflow "$BASE/nextflow-$V-all"
            chmod +x nextflow
          fi
          sudo mv nextflow /usr/local/bin/nextflow
          nextflow -version

      - name: Cache FlashFry
        id: cache-flashfry
        uses: actions/cache@v4
        with:
          path: FlashFry.jar
          key: flashfry-1.15

      - name: Download FlashFry
        if: steps.cache-flashfry.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o FlashFry.jar \
            https://github.com/mckennalab/FlashFry/releases/download/1.15/FlashFry-assembly-1.15.jar

      - name: Build a synthetic mini-genome and FlashFry index
        # A real reference is 3.2GB; the pipeline logic does not care how big
        # the genome is, so CI builds a tiny one and indexes it for real.
        run: |
          mkdir -p ci_ref ci_ref/tmp
          python - <<'EOF'
          import random
          random.seed(7)
          with open("ci_ref/mini.fa", "w") as f:
              for chrom, length in [("chr1", 200000), ("chr2", 120000)]:
                  seq = "".join(random.choice("ACGT") for _ in range(length))
                  f.write(f">{chrom}\n")
                  for i in range(0, length, 60):
                      f.write(seq[i:i+60] + "\n")
          EOF
          samtools faidx ci_ref/mini.fa
          java -Xmx4g -jar FlashFry.jar index \
            --tmpLocation ci_ref/tmp \
            --database ci_ref/mini_cas9ngg_db \
            --reference ci_ref/mini.fa \
            --enzyme spcas9ngg

      - name: Build test inputs
        run: |
          printf 'chr1:10000-10400\nchr1:10600-11000\nchr1:50000-50300\nchr2:20000-20500\n' > ci_enh.txt
          printf 'chr1:120000\nchr2:60000\n' > ci_snps.txt
          python - <<'EOF'
          import random
          random.seed(3)
          with open("ci_atac.narrowPeak", "w") as f:
              for chrom, n, maxp in [("chr1", 40, 200000), ("chr2", 20, 120000)]:
                  for i in range(n):
                      s = random.randrange(0, maxp - 500)
                      f.write(f"{chrom}\t{s}\t{s+400}\tpeak{i}\t500\t.\t5.5\t3.1\t2.0\t{200 if i%5 else -1}\n")
          EOF

      - name: Run the pipeline
        run: |
          # --chunk_size is passed on the COMMAND LINE on purpose. Nextflow 26
          # delivers CLI params as String while config/profile values arrive as
          # Integer, and splitFasta(by:) rejects the String. Supplying it only
          # via the test profile would never exercise that path.
          nextflow run . -profile test,local \
            --snp_bed ci_snps.txt \
            --enhancer_bed ci_enh.txt \
            --fasta ci_ref/mini.fa \
            --flashfry_jar FlashFry.jar \
            --flashfry_db ci_ref/mini_cas9ngg_db \
            --atac_narrowpeak ci_atac.narrowPeak \
            --dedup_blast_radius \
            --chunk_size 2 \
            --outdir results_ci

      - name: Build a seed-screening reference and run the seed screen
        # Exercisable in CI because the reference is BUILT from an annotation
        # rather than downloaded: a synthetic GTF over the mini-genome gives a
        # real promoter reference in under a second.
        run: |
          python - <<'EOF'
          import random
          random.seed(21)
          with open("ci_genes.gtf", "w") as f:
              f.write("##description: CI test annotation\n")
              gid = 0
              for chrom, length in [("chr1", 200000), ("chr2", 120000)]:
                  for pos in range(8000, length - 8000, 24000):
                      gid += 1
                      strand = random.choice("+-")
                      f.write(
                          f'{chrom}\tCI\tgene\t{pos}\t{pos+3000}\t.\t{strand}\t.\t'
                          f'gene_id "ENSG{gid:08d}"; gene_name "GENE{gid}"; '
                          f'gene_type "protein_coding";\n'
                      )
          EOF
          export CRETARGET_CACHE_DIR="$PWD/ci_cache"
          cretarget build-seed-reference --fasta ci_ref/mini.fa --gtf ci_genes.gtf

          nextflow run . -profile test,local \
            --enhancer_bed ci_enh.txt \
            --fasta ci_ref/mini.fa \
            --flashfry_jar FlashFry.jar \
            --flashfry_db ci_ref/mini_cas9ngg_db \
            --chunk_size 2 \
            --run_seed_finder \
            --seed_finder_min_length 10 \
            --seed_finder_tss_window 2000 \
            --outdir results_seed

      - name: Verify the seed screen found both orientations
        # The regression this guards: a scanner that indexes each guide under
        # only one orientation silently reports hits on a single strand and
        # misses about half of all true sites, while exiting 0. A one-sided
        # strand column is the visible symptom.
        run: |
          python - <<'EOF'
          import collections, csv, glob, sys

          hits_files = glob.glob("results_seed/seed_finder/*_raw_hits.csv")
          assert len(hits_files) == 1, f"expected one hit table, got {hits_files}"
          rows = list(csv.DictReader(open(hits_files[0])))
          print(f"{len(rows)} seed hits")

          problems = []
          if not rows:
              problems.append("the seed screen found no hits at all")
          strands = collections.Counter(r["strand"] for r in rows)
          print("strands:", dict(strands))
          if set(strands) != {"+", "-"}:
              problems.append(
                  f"hits are not on both strands: {dict(strands)}. A scanner that "
                  f"indexes guides under one orientation only looks exactly like "
                  f"this and misses ~half of all true sites."
              )

          final = list(csv.DictReader(open("results_seed/guides.final.tsv"),
                                      delimiter="\t"))
          ranked = list(csv.DictReader(open("results_seed/guides.ranked.tsv"),
                                       delimiter="\t"))
          if len(final) != len(ranked):
              problems.append(
                  f"guides.final.tsv has {len(final)} rows but guides.ranked.tsv "
                  f"has {len(ranked)}")
          for column in ("seedfinder_hit_count", "seedfinder_closest_gene",
                         "seedfinder_closest_tss_distance",
                         "seedfinder_closest_seed_length"):
              if final and column not in final[0]:
                  problems.append(f"missing column {column} in guides.final.tsv")

          # Guides excluded by the hard filters are not screened, and must be
          # blank rather than reported as a confident zero.
          if final and "passes_hard_filters" in final[0]:
              for row in final:
                  screened = row["passes_hard_filters"].strip().lower() in (
                      "true", "1", "yes")
                  blank = row["seedfinder_hit_count"] == ""
                  if screened == blank:
                      problems.append(
                          f"screened/blank mismatch for {row.get('region_id')}: "
                          f"passes={row['passes_hard_filters']!r} "
                          f"count={row['seedfinder_hit_count']!r}")
                      break

          if problems:
              print("\nFAILED:")
              for problem in problems:
                  print(" -", problem)
              sys.exit(1)
          print("\nseed screen OK")
          EOF

      - name: Verify the outputs
        run: |
          python - <<'EOF'
          import sys
          import pandas as pd

          df = pd.read_csv("results_ci/guides.ranked.tsv", sep="\t")
          problems = []

          if df.empty:
              problems.append("no guides in output")
          # One header only: collectFile must not have concatenated them all.
          with open("results_ci/guides.ranked.tsv") as fh:
              if sum(1 for line in fh if line.startswith("contig\t")) != 1:
                  problems.append("repeated header rows in collated output")
          for column in ("region_id", "genome_start", "composite_score", "rank",
                         "spacer", "distance_to_atac_summit"):
              if column not in df.columns:
                  problems.append(f"missing column: {column}")
          if df["region_id"].nunique() < 6:
              problems.append(f"expected >=6 regions, got {df['region_id'].nunique()}")
          if not df["target_ref"].notna().all():
              problems.append("some guides did not join to region metadata")

          for path in ("results_ci/run_manifest.json",
                       "results_ci/software_versions.yml"):
              try:
                  open(path).close()
              except OSError:
                  problems.append(f"missing provenance file: {path}")

          if problems:
              print("FAILED:")
              for p in problems:
                  print("  -", p)
              sys.exit(1)
          print(f"OK: {len(df)} guides across {df['region_id'].nunique()} regions")
          EOF

      - name: Verify the output is byte-identical across two independent runs
        # Guards the collectFile ordering. `sort: true` ordered chunks by
        # absolute path, which contains the random work-directory hash, so two
        # identical runs produced byte-different output. Nothing was lost, but
        # "same input, same output" is a claim this pipeline has to be able to
        # make, so it is checked rather than assumed.
        run: |
          # Identical flags to the first run; only the work dir and outdir
          # differ. Comparing runs with different --chunk_size would test
          # something stronger than determinism and could fail for a
          # legitimate reason.
          nextflow run . -profile test,local -w work_det \
            --snp_bed ci_snps.txt \
            --enhancer_bed ci_enh.txt \
            --fasta ci_ref/mini.fa \
            --flashfry_jar FlashFry.jar \
            --flashfry_db ci_ref/mini_cas9ngg_db \
            --atac_narrowpeak ci_atac.narrowPeak \
            --dedup_blast_radius \
            --chunk_size 2 \
            --outdir results_det
          if ! cmp -s results_ci/guides.ranked.tsv results_det/guides.ranked.tsv; then
            echo "ERROR: two runs of the same input produced different output"
            diff <(head -5 results_ci/guides.ranked.tsv) \
                 <(head -5 results_det/guides.ranked.tsv) || true
            exit 1
          fi
          echo "OK: output is reproducible across runs"

      - name: Verify -resume caches every task
        run: |
          nextflow run . -profile test,local -resume \
            --snp_bed ci_snps.txt \
            --enhancer_bed ci_enh.txt \
            --fasta ci_ref/mini.fa \
            --flashfry_jar FlashFry.jar \
            --flashfry_db ci_ref/mini_cas9ngg_db \
            --atac_narrowpeak ci_atac.narrowPeak \
            --dedup_blast_radius \
            --outdir results_ci 2>&1 | tee resume.log
          if ! grep -q "cached" resume.log; then
            echo "ERROR: -resume did not reuse any cached tasks"
            exit 1
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextflow-logs-${{ matrix.nxf_version }}
          path: |
            .nextflow.log
            results_ci/pipeline_info/
