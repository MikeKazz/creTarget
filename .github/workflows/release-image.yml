name: Release image

# Builds and publishes the runtime container.
#
# This exists so the image is never built on a maintainer's laptop. Two things
# went wrong that way:
#
#   * ARCHITECTURE. Docker Desktop on Apple Silicon builds for the host, so a
#     release cut from a Mac would publish an arm64 image. Every HPC cluster is
#     x86-64, and the failure surfaces as "exec format error" in a task log,
#     far from anything that names the release. Runners are x86-64, and the
#     build is pinned to linux/amd64 regardless.
#   * SKEW. The Dockerfile installs the Python package from the build context,
#     so the image content is whatever the working tree happened to be. Here it
#     is always a clean checkout of the tag being released.
#
# Triggers on a v* tag, or run it by hand for a tag that already exists:
#     gh workflow run release-image.yml -f tag=v0.6.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.6.0"
        required: true
        type: string

jobs:
  image:
    name: build and push ghcr image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # What lets GITHUB_TOKEN push to ghcr.io; no personal access token needed.
      packages: write

    steps:
      - name: Resolve the tag being released
        id: ref
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$TAG" in
            v*) ;;
            *) echo "ERROR: expected a v-prefixed tag, got '$TAG'" >&2; exit 1 ;;
          esac
          echo "tag=$TAG"               >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"       >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - name: Check the tag agrees with the version in the tree
        # A tag pointing at a commit whose pyproject says something else would
        # publish an image labelled with a version it does not contain.
        run: |
          WANT="${{ steps.ref.outputs.version }}"
          GOT=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "$WANT" != "$GOT" ]; then
            echo "ERROR: tag says $WANT but pyproject.toml says $GOT" >&2
            exit 1
          fi
          GOT_NF=$(sed -n "s/^    version         = '\(.*\)'/\1/p" nextflow.config)
          if [ "$WANT" != "$GOT_NF" ]; then
            echo "ERROR: tag says $WANT but nextflow.config says $GOT_NF" >&2
            exit 1
          fi
          echo "OK: tree is at $WANT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Pinned, not inherited from the runner. See the header.
          platforms: linux/amd64
          push: true
          # buildx attaches provenance/SBOM attestations by default, which
          # turns a plain manifest into an OCI index carrying an extra
          # "unknown/unknown" entry. Images through 0.5.1 were plain
          # manifests, and attestation indexes are a known source of friction
          # for Singularity/Apptainer -- which is the profile this project
          # recommends as the portable one. Not worth the risk for metadata
          # nobody here consumes.
          provenance: false
          sbom: false
          tags: |
            ghcr.io/mikekazz/cretarget:${{ steps.ref.outputs.version }}
            ghcr.io/mikekazz/cretarget:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify what was actually published
        # The image is the thing users run; confirm its architecture and that
        # the package inside reports the version on the label, rather than
        # assuming the build did what the tags say.
        run: |
          IMAGE="ghcr.io/mikekazz/cretarget:${{ steps.ref.outputs.version }}"
          docker pull "$IMAGE"

          ARCH=$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')
          echo "architecture: $ARCH"
          if [ "$ARCH" != "linux/amd64" ]; then
            echo "ERROR: published $ARCH; clusters need linux/amd64" >&2
            exit 1
          fi

          # A single-platform manifest, as every release through 0.5.1 was.
          # An index with an extra attestation entry is what buildx produces
          # by default and is what Singularity can trip over.
          MEDIA=$(docker buildx imagetools inspect "$IMAGE" --raw | head -c 400)
          if echo "$MEDIA" | grep -q '"manifests"'; then
            echo "ERROR: published a manifest index; expected a plain manifest" >&2
            docker buildx imagetools inspect "$IMAGE" >&2
            exit 1
          fi
          echo "OK: single linux/amd64 manifest"

          GOT=$(docker run --rm "$IMAGE" cretarget --version | tr -d '\r')
          echo "image reports: $GOT"
          if [ "$GOT" != "creTarget ${{ steps.ref.outputs.version }}" ]; then
            echo "ERROR: image contains '$GOT', expected creTarget ${{ steps.ref.outputs.version }}" >&2
            exit 1
          fi

          # The tools the pipeline actually shells out to.
          docker run --rm "$IMAGE" bedtools --version
          docker run --rm "$IMAGE" samtools --version | head -1
          docker run --rm "$IMAGE" java -version 2>&1 | head -1
          echo "OK: $IMAGE is linux/amd64 and contains ${{ steps.ref.outputs.version }}"
