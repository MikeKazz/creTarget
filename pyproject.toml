[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cretarget"
version = "0.2.1"
description = "Design, score, and rank CRISPRi guide RNAs for noncoding target regions (SNPs/enhancers, hg38)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mehrdad Kazemi" }
]
keywords = ["crispri", "crispr", "guide-rna", "genome-editing", "bioinformatics", "flashfry", "nextflow"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/MikeKazz/creTarget"
Repository = "https://github.com/MikeKazz/creTarget"
Issues = "https://github.com/MikeKazz/creTarget/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.scripts]
cretarget = "cretarget.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
