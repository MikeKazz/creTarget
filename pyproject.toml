[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cretarget"
version = "0.5.1"
description = "Design, score, and rank CRISPRi guide RNAs for noncoding target regions (SNPs/enhancers, hg38)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mehrdad Kazemi" }
]
keywords = ["crispri", "crispr", "guide-rna", "genome-editing", "bioinformatics", "flashfry", "nextflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
    Homepage = "https://github.com/MikeKazz/creTarget"
    Documentation = "https://mikekazz.github.io/creTarget/"
    Wiki = "https://github.com/MikeKazz/creTarget/wiki"
    Repository = "https://github.com/MikeKazz/creTarget"
    Issues = "https://github.com/MikeKazz/creTarget/issues"
    Changelog = "https://github.com/MikeKazz/creTarget/blob/main/CHANGELOG.md"
    Container = "https://github.com/MikeKazz/creTarget/pkgs/container/cretarget"
    Zenodo = "https://doi.org/10.5281/zenodo.24148024"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=5",
    "build",
    "twine",
    "ruff>=0.9",
    "pre-commit>=3.7",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "pymdown-extensions>=10.7,<11",
]

[project.scripts]
cretarget = "cretarget.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["cretarget"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["site", "work", "results", "results_*", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["cretarget"]
