site_name: creTarget
site_description: CRISPRi guide RNA design, scoring, and ranking for the noncoding genome
site_url: https://mikekazz.github.io/creTarget/
site_author: Mehrdad Kazemi
repo_url: https://github.com/MikeKazz/creTarget
repo_name: MikeKazz/creTarget
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Mehrdad Kazemi &middot; MIT License

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quickstart.md
      - Reference data: getting-started/reference-data.md
  - Guides:
      - Input formats: guides/inputs.md
      - Output files: guides/outputs.md
      - launch-dCas9 scoring: guides/launch-dcas9.md
      - ATAC-seq annotation: guides/atac-seq.md
      - Seed screening: guides/seed-screening.md
      - Scaling and clusters: guides/scaling-and-clusters.md
      - Cluster walkthrough: cluster-setup.md
      - Troubleshooting: guides/troubleshooting.md
      - FAQ: guides/faq.md
  - Reference:
      - Pipeline parameters: reference/parameters.md
      - Step-level CLI: reference/cli.md
      - Output columns: reference/output-columns.md
      - Provenance: reference/provenance.md
  - Project:
      - Architecture: project/architecture.md
      - Contributing: project/contributing.md
      - Release process: project/releasing.md
      - Citation: project/citation.md
      - Changelog: https://github.com/MikeKazz/creTarget/blob/main/CHANGELOG.md
      - License: https://github.com/MikeKazz/creTarget/blob/main/LICENSE

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MikeKazz/creTarget
      name: creTarget on GitHub
    - icon: fontawesome/solid/book
      link: https://github.com/MikeKazz/creTarget/wiki
      name: GitHub wiki
    - icon: fontawesome/solid/quote-left
      link: https://doi.org/10.5281/zenodo.24148024
      name: Cite creTarget

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
