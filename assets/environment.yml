# Conda environment for `-profile conda`.
#
# Channel order is conda-forge BEFORE bioconda, which is what bioconda itself
# requires. This overrides whatever order a user's ~/.condarc happens to have
# (a bioconda-first .condarc with strict priority is a common cause of broken
# samtools/htslib solves).
name: cretarget
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10
  - pandas>=1.5
  - numpy>=1.23
  - bedtools>=2.30
  - samtools>=1.13
  - openjdk>=17          # Nextflow >=24.04 and FlashFry both want a modern JVM
  - pip
  - pip:
      # Installed from GitHub, not PyPI. PyPI is not required for this
      # pipeline -- a git install works everywhere pip does.
      #
      # IMPORTANT: `@main` is NOT reproducible; main moves. Before any run
      # whose results you intend to publish, pin this to a tag:
      #     - git+https://github.com/MikeKazz/creTarget.git@v0.2.0
      # A pinned tag (or a container image) is what makes a run repeatable
      # years later. Publishing to PyPI would let this read
      # `- cretarget==0.2.0`, which is tidier but no more reproducible.
      - git+https://github.com/MikeKazz/creTarget.git@main
