# Conda environment for `-profile conda`.
#
# VERSIONS ARE PINNED ON PURPOSE, for two reasons:
#
# 1. Correctness. Unpinned, this file resolved to python 3.15 / pandas 3.1 /
#    numpy 2.5 -- none of which creTarget has ever been tested against, and
#    pandas 3.x has breaking API changes. The pins below are the versions the
#    test suite and the published benchmark actually ran on.
#
# 2. Solve time. Unpinned, conda's classic solver (still the default in conda
#    <23.10 without conda-libmamba-solver) can take an hour or effectively
#    hang on this dependency set. Pinned, the same solve takes seconds.
#    If it is still slow for you, pass --conda_frontend micromamba.
#
# Channel order is conda-forge BEFORE bioconda, which is what bioconda itself
# requires. A bioconda-first ~/.condarc with strict priority is a common cause
# of broken htslib/samtools solves; declaring the order here avoids it.
name: cretarget
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pandas=2.2
  - numpy=1.26
  - bedtools=2.31
  - samtools=1.21
  # Nextflow itself requires Java 17+, so anyone running this pipeline already
  # has a JVM -- but pinning one here keeps the task environment self-contained
  # on clusters where the compute nodes differ from the submit host. It is the
  # single largest thing in the environment (~174 MB, and it pulls X11 libs).
  - openjdk=17
  - pip
  - pip:
      # Installed from GitHub's release TARBALL, deliberately not `git+https`.
      #
      # A `git+https://...` install needs the git binary, network, AND working
      # git credentials on whatever node builds the environment. In practice it
      # failed with "Authentication failed / Repository not found" even for a
      # public repo, because pip runs the clone as a subprocess with
      # GIT_TERMINAL_PROMPT=0 and a stale credential helper is enough to break
      # it. An archive URL is a plain HTTPS GET: no git, no auth, no prompt.
      #
      # It is also immutable. `@main` moved, so two people installing months
      # apart got different code; a tag tarball cannot change.
      #
      # Bump this URL whenever you cut a new tag.
      - https://github.com/MikeKazz/creTarget/archive/refs/tags/v0.2.5.tar.gz
